name: devflow

services:
  mysql:
    image: mysql:8.0
    platform: linux/arm64
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-devflow}
      MYSQL_USER: ${MYSQL_USER:-devflow}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes: [mysql_data:/var/lib/mysql]
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$$MYSQL_USER -p$$MYSQL_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    platform: linux/arm64
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes: [redis_data:/data]
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: { context: ., dockerfile: docker/api.Dockerfile }
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: mysql://${MYSQL_USER:-devflow}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-devflow}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      STORAGE_LOCAL_PATH: /app/uploads
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
    volumes: [attachment_data:/app/uploads]
    networks: [internal]
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health/ready >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  migrate:
    build: { context: ., dockerfile: docker/api.Dockerfile }
    profiles: ["migration"]
    restart: "no"
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://${MYSQL_USER:-devflow}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-devflow}
    command: ["npx", "prisma", "migrate", "deploy", "--schema=prisma/schema.prisma"]
    networks: [internal]
    depends_on:
      mysql: { condition: service_healthy }

  worker:
    build: { context: ., dockerfile: docker/worker.Dockerfile }
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://${MYSQL_USER:-devflow}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-devflow}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    networks: [internal]
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    build: { context: ., dockerfile: docker/web.Dockerfile }
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/certs:/etc/nginx/certs:ro
    networks: [internal]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

networks:
  internal: { driver: bridge }
volumes:
  mysql_data:
  redis_data:
  attachment_data:
